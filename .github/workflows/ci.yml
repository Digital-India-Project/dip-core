name: DIP Core CI

on:
  pull_request:
  push:
    branches:
      - 'development/**'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Boundaries, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Verify pure core dependency boundaries
        run: npm run check:boundaries

      - name: Run unit and contract tests
        run: npm test

      - name: Build library package output
        run: npm run build:lib

      - name: Build workbench application
        run: npm run build
